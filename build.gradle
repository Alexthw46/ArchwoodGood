//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0+'
}

base {
    version = "${minecraft_version}-${mod_version}"
    group = 'com.alexthw.archwood_good' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
    archivesBaseName = 'archwood_good'
}

// Mojang ships Java 21 to end users in 1.21+
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Comment the line below if you don't need to share the source jar (e.g. if nothing needs you as a dependency)
java.withSourcesJar()

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = "1.21"
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

//minecraft.accessTransformers.files(
//       file('src/main/resources/META-INF/accesstransformer.cfg')
//)

sourceSets.main.resources { srcDir "src/generated/resources" }

repositories {
    mavenCentral()
    flatDir {
        dirs 'externalmods'
    }

    mavenLocal()

    maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" } // Moonlight & EveryComp

    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel

    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    maven { url = "https://maven.terraformersmc.com/" } // EMI

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = 'Forge'
        url = "https://maven.minecraftforge.net"
    }
    maven {
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
    maven { url 'https://jitpack.io' }

}

dependencies {

    //+ REQUIRED MODS
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-$minecraft_version:$nouveau_version")
    implementation ("com.alexthw.ars_elemental:ars_elemental-$minecraft_version:$elemental_version")
//    implementation "curse.maven:every-integration-628539:7245196"
//    implementation "curse.maven:selene-499980:7238829"

    implementation("net.mehvahdjukaar:everycomp-neoforge:$everycomp_version:neoforge") {
        transitive = false
    }
    implementation("net.mehvahdjukaar:moonlight-neoforge:$moonlight_version:neoforge") {
        transitive = false
    }
    implementation("net.mehvahdjukaar:supplementaries-neoforge:$supplementaries_version:neoforge") {
        transitive = false
    }

    // only need the compileOnly, the runtime dependency is handled by Ars Nouveau
        // TOOLS
    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
    runtimeOnly "dev.emi:emi-neoforge:$emi_version+$minecraft_version"

        // MAVENS
    compileOnly "software.bernie.geckolib:geckolib-neoforge-$minecraft_version:$geckolib_version"
    compileOnly "vazkii.patchouli:Patchouli:1.21-$patchouli_version"
    compileOnly 'com.github.glitchfiend:TerraBlender-neoforge:1.21-4.0.0.0'
    compileOnly "top.theillusivec4.curios:curios-neoforge:$curios_version"
            // Dependencies
    implementation("dev.engine-room.flywheel:flywheel-neoforge-$minecraft_version:$flywheel_version") // Create
    implementation("net.createmod.ponder:Ponder-NeoForge-$minecraft_version:$ponder_version") // Create
    implementation("com.tterrag.registrate:Registrate:$registrate_version") // Create

        // Curseforge - SUPPORTED MODS
    runtimeOnly "curse.maven:macaws-furniture-359540:7255584"
    runtimeOnly "curse.maven:bibliocraft-legacy-1122260:7055118"
    runtimeOnly "curse.maven:another-furniture-610492:7144788"
    runtimeOnly "curse.maven:farmers-delight-398521:6917256"
    runtimeOnly "curse.maven:macaws-bridges-351725:6543002"
    runtimeOnly "curse.maven:macaws-doors-378646:6146345"
    runtimeOnly "curse.maven:macaws-trapdoors-400933:7256148"
    runtimeOnly "curse.maven:quad-932715:5900860"
    runtimeOnly "curse.maven:more-chest-variants-lieonlion-858032:6833233"

            // MAVENS
    implementation("com.simibubi.create:create-$minecraft_version:$create_version:slim") { transitive = false } // Registrate, Flywheel, Ponder

    //implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // cyanide to debug worldgen, localRuntime configuration won't mark is a dependency
    // localRuntime "curse.maven:cyanide-541676:5782674"


    // Iris Shader tests
    localRuntime "curse.maven:irisshaders-455508:6661598"
    localRuntime "curse.maven:sodium-394468:6382651"
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
                "Specification-Title"     : "ArsNouveau Addon",
                "Specification-Vendor"    : "exampleDev",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "exampleDev",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
